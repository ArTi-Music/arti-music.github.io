<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar.Ti Off The Wall 3D Carousel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://static.wixstatic.com/media/d89c2f_a4f950b5ae3443269f721780c2891589~mv2.png'); 
            background-size: left;
            background-position: left;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            height: 100vh; 
            overflow: hidden;
            padding-left: 50px; 
            box-sizing: border-box;
            position: relative;
            /* Enable global 3D viewing perspective */
            perspective: 1000px; 
        }
        .slider-container {
            position: relative;
            width: 360px; 
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible; /* Switched to visible to prevent 3D cropping */
        }
        .slider-track {
            position: relative;
            width: 380px;  
            height: 540px; 
            transform-style: preserve-3d; /* FIXED: Must be preserve-3d to display depth */
            display: flex;
            justify-content: center;      /* FIXED: Balanced default alignment */
            align-items: center;          /* FIXED: Clean standard syntax */
        }
        .apparel-slide {
            position: absolute;
            width: 330px;  
            height: 500px; 
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 45px 35px rgba(0, 0, 0, 0.75);
            background: #111111; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s, filter 0.5s;
            opacity: 1; 
            backface-visibility: hidden;
        }
        .apparel-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
        }
        .audio-control-btn {
            position: absolute;
            bottom: 60px;
            left: 160px; 
            background: #000000; 
            color: #FFFFFF;
            border: 0px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px; /* Added padding to give the button standard clickable structure */
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <audio id="bg-audio-player" loop crossorigin="anonymous">
        <source src="https://static.wixstatic.com/mp3/d89c2f_2a28902ec8cb46199d53e47f4098e2a0.mp3" type="audio/mpeg">
    </audio>
    <button class="audio-control-btn" id="audio-toggle">PLAY BEAT</button>
    
    <div class="slider-container">
        <div class="slider-wrapper">
            <div class="slider-track" id="apparel-track">
                <div class="apparel-slide" data-index="0"><img src="https://static.wixstatic.com/media/d89c2f_9df9958c984f40d1b43b2dba56c16f5d~mv2.png" alt="Product 1"></div>
                <div class="apparel-slide" data-index="1"><img src="https://static.wixstatic.com/media/d89c2f_5b117830a17a4c30a77931a70b08052d~mv2.png" alt="Product 2"></div>
                <div class="apparel-slide" data-index="2"><img src="https://static.wixstatic.com/media/d89c2f_bb382e81730e4000bc657172c8c0a010~mv2.png" alt="Product 3"></div> 
                <div class="apparel-slide" data-index="3"><img src="https://static.wixstatic.com/media/d89c2f_e3d59dc330ff49e9941d7d5218064dd4~mv2.png" alt="Product 4"></div> 
                <div class="apparel-slide" data-index="4"><img src="https://static.wixstatic.com/media/d89c2f_5849f828f3be450ea09bcf6f709bbc50~mv2.png" alt="Product 5"></div> 
                <div class="apparel-slide" data-index="5"><img src="https://static.wixstatic.com/media/d89c2f_626e96a1fdf8475eaf7632e5328dc935~mv2.png" alt="Product 6"></div> 
            </div>
        </div>
    </div>

<script>
    const track = document.getElementById('apparel-track');
    const slides = Array.from(track.children);
    const container = document.querySelector('.slider-container');
    let currentIndex = 0;
    
    const audio = document.getElementById('bg-audio-player');
    const audioButton = document.getElementById('audio-toggle');
    let rotationTimer = null;
    const rotationSpeed = 3000;

    function updateSlider() {
        const total = slides.length;
        if (total === 0) return;
        
        slides.forEach((slide, index) => {
            let offset = index - currentIndex;
            if (offset < -Math.floor(total / 2)) offset += total;
            if (offset > Math.floor(total / 2)) offset -= total;
            const absOffset = Math.abs(offset);
            
            if (offset === 0) {
                slide.style.transform = `translateX(0px) scale(1.05) rotateY(0deg) translateZ(60px)`;
                slide.style.zIndex = "10";
                slide.style.opacity = "1";
                slide.style.filter = "none";
            } else {
                const rotateYValue = offset > 0 ? -30 : 30;
                slide.style.transform = `translateX(${offset * 140}px) scale(0.8) rotateY(${rotateYValue}deg) translateZ(-40px)`;
                slide.style.zIndex = String(5 - Math.ceil(absOffset));
                slide.style.opacity = "0.35"; 
                slide.style.filter = "blur(2px) brightness(0.45)";
            }
        });
    }

    function moveNext() { 
        currentIndex = (currentIndex + 1) % slides.length; 
        updateSlider(); 
    }

    slides.forEach((slide) => {
        slide.addEventListener('click', () => {
            const idx = parseInt(slide.getAttribute('data-index'), 10);
            if (!isNaN(idx)) {
                currentIndex = idx;
                updateSlider();
            }
        });
    });

    // FIXED AUTO-SCROLL HOVER LOGIC
    function startRotation() {
        if (!rotationTimer) {
            rotationTimer = setInterval(moveNext, rotationSpeed);
        }
    }

    function stopRotation() {
        if (rotationTimer) {
            clearInterval(rotationTimer);
            rotationTimer = null;
        }
    }

    // Initialize Auto-play instantly on load
    startRotation();

    // Safely pause on hover over the container, restart when mouse leaves
    if (container) {
        container.addEventListener('mouseenter', stopRotation);
        container.addEventListener('mouseleave', startRotation);
    }

    // Audio Frame Setup
    audioButton.addEventListener('click', function() {
        if (audio.paused) {
            audio.play()
                .then(() => { audioButton.textContent = "MUTED"; })
                .catch(err => {
                    console.log("Audio block error:", err);
                    alert("iFrame configurations might be restricting autoplay. Click inside canvas area to initialize custom settings.");
                });
        } else {
            audio.pause();
            audioButton.textContent = "PLAY BEAT";
        }
    });

    updateSlider();
</script>
</body>
</html>
