            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arcade Era Carousel</title>
    <style>
        @import url('https://googleapis.com');
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://static.wixstatic.com/media/d89c2f_5551891a53c5485cbaeec92a66041a8a~mv2.png'); 
            background-size: bottom;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Roboto, 'Press Start 2P'; 
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            height: 100vh; 
            overflow: hidden;
            padding-left: 80px; 
            box-sizing: border-box;
            position: relative;  /* Enable global 3D viewing perspective */
            perspective: 4000px; 
      }
        
   .slider-container {
            position: absolute;   /* FIXED: Lock to absolute space */
            left: 80px;          /* Pins container to the far left side */
            top: 50%;
            transform: translateY(-50%);
            width: 360px; 
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            z-index: 10;
        }
        
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible; /* Switched to visible to prevent 3D cropping */

        }
         .slider-track {
            position: relative;
            width: 1980px;  
            height: 840px; 
            transform-style: preserve-3d; /* FIXED: Must be preserve-3d to display depth */
            display: flex;
            justify-content: center;      /* FIXED: Balanced default alignment */
            align-items: center;          /* FIXED: Clean standard syntax */
        }
        .apparel-slide {
            position: absolute;
            width: 330px;  
            height: 500px; 
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 45px 35px rgba(0, 0, 0, 0.75);
            background: #111111; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s, filter 0.5s;
            opacity: 1; 
            backface-visibility: hidden;
            
            /* Required to lock text info to the bottom of the card */
            position: relative;
        }
        .apparel-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
        }
        
        /* ==========================================================================
           SAFE EMBEDDED TEXT LAYOUT (Will not impact your original slider variables)
           ========================================================================== */
        .card-details-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0) 100%);
            padding: 30px 15px 15px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .card-title {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0 0 4px 0;
            text-align: center;
        }
        .card-price {
            color: #D4AF37; 
            font-size: 1.05rem;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .card-btn {
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            width: 80%;
            padding: 8px 0;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.75rem;
            text-align: center;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        /* Show the shop button when you hover your mouse over a card */
        .apparel-slide:hover .card-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .arcade-title-float {
            position: absolute;
            right: 80px;                  
            top: 50%;
            transform: translateY(-90%);  
            width: 400px;             
            z-index: 2;                   
            pointer-events: none;         
            opacity: 0;                   
            animation: 
                fadeInTitle 8s ease-out 0.6s forwards, 
                gentleFloat 8s ease-in-out infinite;   
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .arcade-title-text-fallback {
            font-family: 'Press Start 2P', Monospace;
            color: #D4AF37;
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: lowercase;
            text-shadow: -8px 8px 0px #000000, -8px 8px 20px rgba(0,0,0,0.8);
            line-height: 1.1;
        }
        @keyframes fadeInTitle {
            0% { opacity: 0; transform: translateY(-46%) scale(0.95); }
            100% { opacity: 1; transform: translateY(-50%) scale(1); }
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(-50%); }
            50% { transform: translateY(-64%); }
        }

        .audio-control-btn {
            position: absolute;
            bottom: 110px;
            left: 160px; 
            background: rgba(0, 0, 0, 0.75); 
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 50px;
            height: 50px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .audio-control-btn:hover {
            transform: scale(1.08);
            background: #000000;
            border-color: rgba(255, 255, 255, 0.6);
        }
        .audio-control-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <audio id="bg-audio-player" loop crossorigin="anonymous">
        <source src="https://static.wixstatic.com/mp3/d89c2f_2a28902ec8cb46199d53e47f4098e2a0.mp3" type="audio/mpeg">
    </audio>

    <button class="audio-control-btn" id="audio-toggle" aria-label="Toggle Audio">
        <svg xmlns="http://w3.org" viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
    </button>

    <div class="arcade-title-float">
        <div class="arcade-title-text-fallback">the<br>arcade<br>era</div>
    </div>
    
    <div class="slider-container">
        <div class="slider-wrapper">
            <div class="slider-track" id="apparel-track">
                
                <div class="apparel-slide" data-index="0">
                    <img src="https://static.wixstatic.com/media/d89c2f_9df9958c984f40d1b43b2dba56c16f5d~mv2.png" alt="Product 1">
                    <div class="card-details-panel">
                        <div class="card-title">Arcade Tee</div>
                        <div class="card-price">93.48 NZD</div>
                        <a class="card-btn" href="https://www.rofaiva.co.nz/product-page/arcade-tee" target="_top">SHOP NOW</a>
                    </div>
                </div>
                
                <div class="apparel-slide" data-index="1">
                    <img src="https://static.wixstatic.com/media/d89c2f_bb382e81730e4000bc657172c8c0a010~mv2.png" alt="Product 2">
                    <div class="card-details-panel">
                        <div class="card-title">The Arcade Hood</div>
                        <div class="card-price">101.08 NZD</div>
                        <a class="card-btn" href="https://rofaiva.co.nz/product-page/the-arcade-hood" target="_top">SHOP NOW</a>
                    </div>
                </div>
                
                <div class="apparel-slide" data-index="2">
                    <img src="https://static.wixstatic.com/media/d89c2f_5b117830a17a4c30a77931a70b08052d~mv2.png" alt="Product 3">
                    <div class="card-details-panel">
                        <div class="card-title">Arcade Tee</div>
                        <div class="card-price">93.48 NZD</div>
                        <a class="card-btn" href="https://rofaiva.co.nz/product-page/the-arcade-tee" target="_top">SHOP NOW</a>
                    </div>
                </div> 
                
                <div class="apparel-slide" data-index="3">
                    <img src="https://static.wixstatic.com/media/d89c2f_626e96a1fdf8475eaf7632e5328dc935~mv2.png" alt="Product 4">
                    <div class="card-details-panel">
                        <div class="card-title">Arcade Tee</div>
                        <div class="card-price">101.08 NZD</div>
                        <a class="card-btn" href="https://rofaiva.co.nz/product-page/arcade-tee" target="_top">SHOP NOW</a>
                    </div>
                </div> 
                  
<script>
    const track = document.getElementById('apparel-track');
    const slides = Array.from(track.children);
    const container = document.querySelector('.slider-container');
    let currentIndex = 0;
    
    const audio = document.getElementById('bg-audio-player');
    const audioButton = document.getElementById('audio-toggle');
    let rotationTimer = null;
    const rotationSpeed = 3000;

    function updateSlider() {
        const total = slides.length;
        if (total === 0) return;
        
        slides.forEach((slide, index) => {
            let offset = index - currentIndex;
            if (offset < -Math.floor(total / 2)) offset += total;
            if (offset > Math.floor(total / 2)) offset -= total;
            const absOffset = Math.abs(offset);
            
            if (offset === 0) {
                slide.style.transform = `translateX(0px) scale(1.05) rotateY(0deg) translateZ(60px)`;
                slide.style.zIndex = "1";
                slide.style.opacity = "1";
                slide.style.filter = "none";
            } else {
                const rotateYValue = offset > -5 ? -5 : -5;
                slide.style.transform = `translateX(${offset * 140}px) scale(0.8) rotateY(${rotateYValue}deg) translateZ(10px)`;
                slide.style.zIndex = String(10 - Math.ceil(absOffset));
                slide.style.opacity = "0.35"; 
                slide.style.filter = "blur(2px) brightness(0.45)";
            }
        });
    }

    function moveNext() { 
        currentIndex = (currentIndex + 1) % slides.length; 
        updateSlider(); 
    }

    slides.forEach((slide) => {
        slide.addEventListener('click', () => {
            const idx = parseInt(slide.getAttribute('data-index'), 10);
            if (!isNaN(idx)) {
                currentIndex = idx;
                updateSlider();
            }
        });
    });

    // FIXED AUTO-SCROLL HOVER LOGIC
    function startRotation() {
        if (!rotationTimer) {
            rotationTimer = setInterval(moveNext, rotationSpeed);
        }
    }

    function stopRotation() {
        if (rotationTimer) {
            clearInterval(rotationTimer);
            rotationTimer = null;
        }
    }

    // Initialize Auto-play instantly on load
    startRotation();

    // Safely pause on hover over the container, restart when mouse leaves
    if (container) {
        container.addEventListener('mouseenter', stopRotation);
        container.addEventListener('mouseleave', startRotation);
    }

       audioButton.addEventListener('click', function() {
        if (audio.paused) {
            audio.play()
                .then(() => { 
                    // Turns the vector icon crimson when music plays
                    audioButton.style.color = "#FFD700"; 
                })
                .catch(err => {
                    console.log("Audio block error:", err);
                    alert("iFrame configurations might be restricting autoplay. Click inside canvas area to initialize custom settings.");
                });
        } else {
            audio.pause();
            // Turns the vector icon white when music is paused
            audioButton.style.color = "#FFFFFF"; 
        }
    });


    updateSlider();
</script>
</body>
</html>
