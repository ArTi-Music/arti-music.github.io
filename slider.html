<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar.Ti Off The Wall 3D Carousel</title>
    <style>
        /* Global Base Settings */
        body {
            margin: 0;
            padding: 0;
            /* Locked your custom graffiti brick wall as the permanent main background */
            background-image: url('https://static.wixstatic.com/media/d89c2f_a52daac133f74cbc86c1b7de2433a35a~mv2.png'); 
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: flex-start; /* Aligns content strictly to the left side of the screen */
            align-items: center;
            height: 600px;
            overflow: hidden;
            padding-left: 60px; /* Spacing away from the absolute left screen edge */
            box-sizing: border-box;
            position: relative;
        }

        /* Main Container Outer Bounds */
        .slider-container {
            position: relative;
            width: 500px; /* Narrowed width boundaries to keep the carousel strictly on the left half */
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Viewport Mask Layer */
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The Structural Track */
        .slider-track {
            position: relative;
            width: 320px;  
            height: 440px; 
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Balanced Portrait Slide Frame - Shifted Left to clear the background graffiti artwork */
        .apparel-slide {
            position: absolute;
            width: 300px;  
            height: 420px; 
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.75);
            background: #111111; /* Deep dark matte back-cushion styling */
            border: 1px solid rgba(255, 255, 255, 0.12);
            
            /* Smooth layout transitions */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s, filter 0.6s;
            opacity: 0; 
        }

        /* Image Fit Containment Engine within Portrait Boundaries */
        .apparel-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Shrinks horizontal photos to fit inside the portrait frame without cropping */
            pointer-events: none;
        }

        /* Navigation Arrows styled cleanly to stay near the left-hand track */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #FFFFFF;
            border: 0px solid rgba(255, 255, 255, 0.2);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: background 0.2s;
            user-select: none;
        }

        .slider-arrow:hover {
            background: #C0C0C0;
            color: #000000;
        }

        .prev-arrow { left: -10px; } 
        .next-arrow { right: -10px; }

        /* Floating Urban Audio Activation Button Layout Controls */
        .audio-control-btn {
            position: absolute;
            bottom: 0px;
            left: 215px; 
            background: #000000; /* Distinct color prompting users to unlock the system */
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: background 0.2s, transform 0.2s;
            user-select: none;
            letter-spacing: 0.5px;
        }

        .audio-control-btn:hover {
            background: #C0C0C0;
            color: #000000;
            transform: scale(1.05);
        }

        /* Responsive Mobile Breaks - Centers slider on small smartphone views */
        @media (max-width: 768px) {
            body { 
                justify-content: center; 
                padding-left: 0; 
            }
            .slider-container { width: 100%; max-width: 340px; height: 380px; }
            .slider-track { width: 220px; height: 320px; }
            .apparel-slide { width: 200px; height: 300px; }
            .slider-arrow { width: 38px; height: 38px; }
            .prev-arrow { left: 5px; }
            .next-arrow { right: 5px; }
            .audio-control-btn {
                left: 50%;
                transform: translateX(-50%);
                bottom: 15px;
            }
            .audio-control-btn:hover {
                transform: translateX(-50%) scale(1.05);
            }
        }
    </style>
</head>
