<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar.Ti Off The Wall 3D Carousel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Uses your exact graffiti brick wall as the permanent background */
            background-image: url('https://static.wixstatic.com/media/d89c2f_a52daac133f74cbc86c1b7de2433a35a~mv2.png'); 
            background-size: cover;
            background-position: center right;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            height: 100vh; /* Forces the box to take up the full available screen height */
            overflow: hidden;
            padding-left: 60px; 
            box-sizing: border-box;
        }

        .slider-container {
            position: relative;
            width: 500px; 
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .slider-track {
            position: relative;
            width: 320px;  
            height: 440px; 
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .apparel-slide {
            position: absolute;
            width: 300px;  
            height: 420px; 
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.75);
            background: #111111; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s, filter 0.6s;
            opacity: 1; /* FORCED ON: Setting this to 1 immediately so you can see the frames even if the music locks up */
        }

        .apparel-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
        }

        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #FFFFFF;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            user-select: none;
            border: none;
        }

        .prev-arrow { left: -10px; } 
        .next-arrow { right: -10px; }

        .audio-control-btn {
            position: absolute;
            bottom: 25px;
            left: 60px; 
            background: #000000; 
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            body { justify-content: center; padding-left: 0; }
            .slider-container { width: 100%; max-width: 340px; height: 380px; }
            .apparel-slide { width: 200px; height: 300px; }
        }
    </style>
</head>
<body>

    <audio id="bg-audio-player" loop>
        <source src="https://static.wixstatic.com/mp3/d89c2f_2286137db53b4fa8a0457672d8d8187a.mp3" data-title="Human Nature" data-artist="Michael Jackson Hoodtrap Remix"></li>
        </ul>" type="audio/mpeg">
    </audio>

    <button class="audio-control-btn" id="audio-toggle" onclick="toggleAudioVolume()">
        PLAY BEAT
    </button>

    <div class="slider-container">
        <button class="slider-arrow prev-arrow" onclick="movePrev()">❮</button>
        <div class="slider-wrapper">
            <div class="slider-track" id="apparel-track">
                
                <div class="apparel-slide" onclick="clickSlide(0)">
                    <img src="https://static.wixstatic.com/media/d89c2f_5849f828f3be450ea09bcf6f709bbc50~mv2.png" alt="Slide 1">
                </div>

                <div class="apparel-slide" onclick="clickSlide(1)">
                    <img src="https://static.wixstatic.com/media/d89c2f_626e96a1fdf8475eaf7632e5328dc935~mv2.png" alt="Slide 2">
                </div>

                <div class="apparel-slide" onclick="clickSlide(2)">
                    <img src="https://wixstatic.com" alt="Slide 3">
                </div> 
                  
                <div class="apparel-slide" onclick="clickSlide(3)">
                    <img src="https://wixstatic.com" alt="Slide 4">
                </div>                
   
            </div>
        </div>
        <button class="slider-arrow next-arrow" onclick="moveNext()">❯</button>
    </div>

<script>
    const track = document.getElementById('apparel-track');
    const slides = Array.from(track.children);
    let currentIndex = 0;
    const audio = document.getElementById('bg-audio-player');
    const audioButton = document.getElementById('audio-toggle');

    function updateSlider() {
        const total = slides.length;
        if (total === 0) return;

        slides.forEach((slide, index) => {
            let offset = index - currentIndex;
            if (offset < -Math.floor(total / 2)) offset += total;
            if (offset > Math.floor(total / 2)) offset -= total;
            const absOffset = Math.abs(offset);
            
            if (offset === 0) {
                slide.style.transform = `translateX(0px) scale(1.05) rotateY(0deg) translateZ(60px)`;
                slide.style.zIndex = "10";
                slide.style.opacity = "1";
                slide.style.filter = "none";
            } else if (offset > 0) {
                slide.style.transform = `translateX(${offset * 110}px) scale(0.8) rotateY(-30deg) translateZ(-40px)`;
                slide.style.zIndex = String(5 - Math.ceil(absOffset));
                slide.style.opacity = "0.35"; 
                slide.style.filter = "blur(2px) brightness(0.45)";
            } else if (offset < 0) {
                slide.style.transform = `translateX(${offset * 110}px) scale(0.8) rotateY(30deg) translateZ(-40px)`;
                slide.style.zIndex = String(5 - Math.ceil(absOffset));
                slide.style.opacity = "0.35"; 
                slide.style.filter = "blur(2px) brightness(0.45)";
            } else {
                slide.style.opacity = "0";
                slide.style.zIndex = "1";
            }
        });
    }

    function toggleAudioVolume() {
        if (audio.paused) {
            audio.play().catch(err => alert("Wix frame is blocking audio permissions. Please check your Wix settings toggles."));
            audioButton.textContent = "MUTED";
        } else {
            audio.pause();
            audioButton.textContent = "PLAY BEAT";
        }
    }

    function clickSlide(index) { currentIndex = index; updateSlider(); }
    function moveNext() { currentIndex = (currentIndex + 1) % slides.length; updateSlider(); }
    function movePrev() { currentIndex = (currentIndex - 1 + slides.length) % slides.length; updateSlider(); }

    updateSlider();
</script>
</body>
</html>
