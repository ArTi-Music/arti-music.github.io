<div class="slider-container">
    <!-- Navigation Controls -->
    <button class="slider-arrow prev-arrow" onclick="movePrev()">❮</button>
    <button class="slider-arrow next-arrow" onclick="moveNext()">❯</button>

    <!-- The Main Stage Wrapper -->
    <div class="slider-wrapper">
        <div class="slider-track" id="apparel-track">
            
            <!-- Slide 1: Main Polynesian Model (Off The Wall Theme) -->
            <div class="apparel-slide" onclick="clickSlide(0)">
                <div class="brick-bg">
                    <img src="YOUR_POLY_MODEL_IMAGE.png" alt="Polynesian Model in Custom Tee">
                </div>
            </div>

            <!-- Slide 2: Streetwear Product "The Arcade Hood" -->
            <div class="apparel-slide" onclick="clickSlide(1)">
                <div class="brick-bg">
                    <img src="arcadehood.png" alt="The Arcade Hood Showcase">
                </div>
            </div>

            <!-- Slide 3: Streetwear Product "Women's Pasifika Hood" -->
            <div class="apparel-slide" onclick="clickSlide(2)">
                <div class="brick-bg">
                    <img src="womenspasifikahood.png" alt="Women's Pasifika Hood Showcase">
                </div>
            </div>
            
        </div>
    </div>
</div>
