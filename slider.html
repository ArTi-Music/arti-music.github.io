<style>
    /* Global Base Settings */
    body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 550px;
        overflow: hidden;
    }

    /* Main Container Outer Bounds */
    .slider-container {
        position: relative;
        width: 100%;
        max-width: 1000px;
        height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* The Viewport Mask Layer */
    .slider-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* The Structural Track */
    .slider-track {
        position: relative;
        width: 300px; 
        height: 420px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Flat Base Slide Blueprint */
    .apparel-slide {
        position: absolute;
        width: 280px;
        height: 400px;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        /* Simple transitions to observe layout movement cleanly */
        transition: transform 0.4s ease, opacity 0.4s; 
        opacity: 0; /* Hidden by default until JavaScript positions them */
    }

    /* Image Asset Containment */
    .apparel-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
    }

    /* Core Navigation Layout Arrows */
    .slider-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: #FFFFFF;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 46px;
        height: 46px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: background 0.2s;
        user-select: none;
    }

    .slider-arrow:hover {
        background: #FFFFFF;
        color: #000000;
    }

    .prev-arrow { left: 40px; }
    .next-arrow { right: 40px; }

    /* Standard Mobile Scaledown Breaks */
    @media (max-width: 768px) {
        .slider-container { height: 400px; }
        .slider-track { width: 200px; height: 300px; }
        .apparel-slide { width: 190px; height: 280px; }
        .slider-arrow { width: 38px; height: 38px; font-size: 1rem; }
        .prev-arrow { left: 15px; }
        .next-arrow { right: 15px; }
    }
</style>

<div class="slider-container">
    <!-- Navigation Controls -->
    <button class="slider-arrow prev-arrow" onclick="movePrev()">❮</button>
    <button class="slider-arrow next-arrow" onclick="moveNext()">❯</button>

    <!-- The Main Stage Wrapper -->
    <div class="slider-wrapper">
        <div class="slider-track" id="apparel-track">
            
            <!-- Slide 1: Main Polynesian Model (Off The Wall Theme) -->
            <div class="apparel-slide" onclick="clickSlide(0)">
                <div class="brick-bg">
                    <img src="YOUR_POLY_MODEL_IMAGE.png" alt="Polynesian Model in Custom Tee">
                </div>
            </div>

            <!-- Slide 2: Streetwear Product "The Arcade Hood" -->
            <div class="apparel-slide" onclick="clickSlide(1)">
                <div class="brick-bg">
                    <img src="arcadehood.png" alt="The Arcade Hood Showcase">
                </div>
            </div>

            <!-- Slide 3: Streetwear Product "Women's Pasifika Hood" -->
            <div class="apparel-slide" onclick="clickSlide(2)">
                <div class="brick-bg">
                    <img src="womenspasifikahood.png" alt="Women's Pasifika Hood Showcase">
                </div>
            </div>
            
        </div>
    </div>
</div>
