<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arcade Era Carousel</title>
  
<link href="https://googleapis.com" rel="stylesheet">
  
    <style>
       body {
          
            margin: 0;
            padding: 0;
            background-image: url('https://static.wixstatic.com/media/d89c2f_fc4391bff2b54460bb239861f8e292a9~mv2.png'); 
            background-size: left;
            background-position: left;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Press Start 2P', system-ui, monospace;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            height: 100vh; 
            overflow: hidden;
            padding-left: 50px; 
            box-sizing: border-box;
            position: relative;
           /* Enable global 3D viewing perspective */
            perspective: 1000px; 
        }
        .slider-container {
            position: relative;
            width: 360px; 
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;/* Switched to visible to prevent 3D cropping */
        }
        .slider-track {
            position: relative;
            width: 380px;  
            height: 540px; 
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
      }
        .apparel-slide {
            position: absolute;
            width: 330px;  
            height: 500px; 
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 5px 5px rgba(0, 0, 0, 0.75);
            background: #111111; 
            border: 0px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s, filter 0.5s;
            opacity: 1; 
            backface-visibility: hidden;
        }
              .slide-image-container {
            width: 100%;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        .apparel-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
        }
        /* Product Meta Details (Title and Price Container) */
        .product-info-panel {
            width: 100%;
            padding: 10px 10px;
            background: #000000;
            border-top: #000000;
            text-align: center;
            box-sizing: border-box;
        }
        .product-title {
            color: #ffffff;
            font-size: 0.8rem;
            margin-bottom: 8px;
            line-height: 1.4;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .product-price {
            color: #FFFFFF;
            font-size: 0.8rem;
            font-weight: medium;
        }
        .fallback-text {
            position: absolute;
            color: #D4AF37;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 1px;
            opacity: 0.7;
            text-align: center;
            pointer-events: none;
            z-index: 1;
        }
        .arcade-title-float {
            position: absolute;
            right: 80px;                  
            top: 50%;
            transform: translateY(-60%);  
            width: 370px;             
            z-index: 2;                   
            pointer-events: none;         
            opacity: 0;                   
            animation: 
                fadeInTitle 8s ease-out 0.6s forwards, 
                gentleFloat 8s ease-in-out infinite;   
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .arcade-title-text-fallback {
            font-family: 'Press Start 2P', system-ui, monospace !important;
            color: #D4AF37;
            font-size: 5.8rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: lowercase;
            text-shadow: -7px 11px 0px #000000, -8px 8px 20px rgba(0,0,0,0.8);
            line-height: 1.1;
        }
        @keyframes fadeInTitle {
            0% { opacity: 0; transform: translateY(-46%) scale(0.95); }
            100% { opacity: 1; transform: translateY(-50%) scale(1); }
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(-50%); }
            50% { transform: translateY(-54%); }
        }
    
         /* UPDATED ROUND MUSIC BUTTON STYLE */
        .audio-control-btn {
            position: absolute;
            bottom: 50px;
            left: 50px; 
            background: transparent; 
            color: #ffffff;
            border: 1px solid #FFFFFF;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 10px; /* Added padding to give the button standard clickable structure */
            transition: color 0.3s ease, border-color 0.3s ease, background-color 0.3s ease, transform 0.2s ease;
        }
        .audio-control-btn:hover {
            transform: scale(1.08);
            color: #D4AF37;
            border-color: #D4AF37;
            background-color: #000000;
        }
        .audio-control-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
       
       /* State style updates to ensure gold color when playing, white when muted */
        .audio-control-btn.playing {
            color: #D4AF37;
            border-color: #D4AF37;
        }
    </style>
</head>
<body>
  
  
    <audio id="bg-audio-player" loop crossorigin="anonymous">
        <source src="https://static.wixstatic.com/mp3/d89c2f_2a28902ec8cb46199d53e47f4098e2a0.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Cleaned Round Audio Button with Embedded SVG Music Note -->
    <button class="audio-control-btn" id="audio-toggle" aria-label="Toggle Audio">
        <svg viewBox="0 0 24 24" xmlns="http://w3.org">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
  </svg>
    </button>

    <div class="arcade-title-float">
        <div class="arcade-title-text-fallback">the<br>arcade<br>era</div>
    </div>
    
    <div class="slider-container">

            <div class="slider-track" id="apparel-track">

                    </div>
                    <div class="product-info-panel">

                </div>
                <!-- Card 3 -->
                <div class="apparel-slide" data-index="2">

                    </div>
                    <div class="product-info-panel">

                       <img src="https://static.wixstatic.com/media/d89c2f_626e96a1fdf8475eaf7632e5328dc935~mv2.png" alt="Product 4">
                    </div>
                    <div class="product-info-panel">
                        <div class="product-title">Arcade Tee</div>

                </div> 
                <!-- Card 5 -->
                <div class="apparel-slide" data-index="4">
                    <div class="slide-image-container">
                        <img src="https://static.wixstatic.com/media/d89c2f_e3d59dc330ff49e9941d7d5218064dd4~mv2.png" alt="Product 5">

                </div> 
          </div>
     </div>
 </div>

<script>
    const track = document.getElementById('apparel-track');
    const slides = Array.from(track.children);
    const container = document.querySelector('.slider-container');
    let currentIndex = 0;
    
    const audio = document.getElementById('bg-audio-player');
    const audioButton = document.getElementById('audio-toggle');
    let rotationTimer = null;
    const rotationSpeed = 1000;

    function updateSlider() {
        const total = slides.length;
        if (total === 0) return;
        
        slides.forEach((slide, index) => {
            let offset = index - currentIndex;
            if (offset < -Math.floor(total / 2)) offset += total;
            if (offset > Math.floor(total / 2)) offset -= total;
            const absOffset = Math.abs(offset);
            
            if (offset === 0) {
                slide.style.transform = `translateX(0px) scale(1.05) rotateY(0deg) translateZ(60px)`;
                slide.style.zIndex = "1";
                slide.style.opacity = "1";
                slide.style.filter = "none";
            } else {
                const rotateYValue = offset > -5 ? -5 : -5;
                slide.style.transform = `translateX(${offset * 140}px) scale(0.8) rotateY(${rotateYValue}deg) translateZ(10px)`;
                slide.style.zIndex = String(10 - Math.ceil(absOffset));
                slide.style.opacity = "0.35"; 
                slide.style.filter = "blur(2px) brightness(0.45)";
            }
        });
    }

    function moveNext() { 
        currentIndex = (currentIndex + 1) % slides.length; 
        updateSlider(); 
    }

    slides.forEach((slide) => {
        slide.addEventListener('click', () => {
            const idx = parseInt(slide.getAttribute('data-index'), 10);
            if (!isNaN(idx)) {
                currentIndex = idx;
                updateSlider();
            }
        });
    });

    // FIXED AUTO-SCROLL HOVER LOGIC
    function startRotation() {
        if (!rotationTimer) {
            rotationTimer = setInterval(moveNext, rotationSpeed);
        }
    }

    function stopRotation() {
        if (rotationTimer) {
            clearInterval(rotationTimer);
            rotationTimer = null;
        }
    }

    // Initialize Auto-play instantly on load
    startRotation();

    // Safely pause on hover over the container, restart when mouse leaves
    if (container) {
        container.addEventListener('mouseenter', stopRotation);
        container.addEventListener('mouseleave', startRotation);
    }

       audioButton.addEventListener('click', function() {
        if (audio.paused) {
            audio.play()
                .then(() => { 
                    // Turns the vector icon crimson when music plays
                    audioButton.style.color = "#FFD700"; 
                })
                .catch(err => {
                    console.log("Audio block error:", err);
                    alert("iFrame configurations might be restricting autoplay. Click inside canvas area to initialize custom settings.");
                });
        } else {
            audio.pause();
            // Turns the vector icon white when music is paused
            audioButton.style.color = "#FFFFFF"; 
        }
    });


    updateSlider();
</script>
</body>
</html>
