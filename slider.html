<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar.Ti Off The Wall 3D Carousel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://static.wixstatic.com/media/d89c2f_5282dbc2f5db496fb82e7c33ed42fcaa~mv2.png'); 
            background-size: left;
            background-position: left;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            height: 100vh; 
            overflow: hidden;
            padding-left: 50px; 
            box-sizing: border-box;
            position: relative;
        }
        .slider-container {
            position: relative;
            width: 360px; 
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .slider-track {
            position: relative;
            width: 380px;  
            height: 540px; 
            transform-style: preserve-3d;
            display: flex;
            justify-content: right;
            align-items: center right;
        }
        .apparel-slide {
            position: absolute;
            width: 400px;  
            height: 520px; 
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.75);
            background: #111111; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s, filter 0.6s;
            opacity: 1; 
        }
        .apparel-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
        }
        .audio-control-btn {
            position: absolute;
            bottom: 131px;
            left: 200px; 
            background: #000000; 
            color: #FFFFFF;
            border: 0px solid rgba(255, 255, 255, 0.3);
            padding: 0px 0px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Native Audio Element with inline fallback attributes -->
    <audio id="bg-audio-player" loop crossorigin="anonymous">
        <source src="https://static.wixstatic.com/mp3/d89c2f_2286137db53b4fa8a0457672d8d8187a.mp3" type="audio/mpeg">
    </audio>

    <button class="audio-control-btn" id="audio-toggle">
        PLAY BEAT
    </button>
    
    <div class="slider-container">
        <div class="slider-wrapper">
            <div class="slider-track" id="apparel-track">
                
                <!-- PASTE YOUR CUSTOM IMAGES AND PRODUCT URLS INSIDE THESE FRAMES: -->
                <div class="apparel-slide" data-index="0">
                    <img src="https://static.wixstatic.com/media/d89c2f_9df9958c984f40d1b43b2dba56c16f5d~mv2.png" alt="Product 1">
                </div>
                <div class="apparel-slide" data-index="1">
                    <img src="https://static.wixstatic.com/media/d89c2f_bb382e81730e4000bc657172c8c0a010~mv2.png" alt="Product 2">
                </div>
                <div class="apparel-slide" data-index="2">
                    <img src="https://static.wixstatic.com/media/d89c2f_5b117830a17a4c30a77931a70b08052d~mv2.png" alt="Product 3">
                </div> 
                <div class="apparel-slide" data-index="3">
                    <img src="https://static.wixstatic.com/media/d89c2f_5849f828f3be450ea09bcf6f709bbc50~mv2.png" alt="Product 4">
                </div> 
                <div class="apparel-slide" data-index="4">
                    <img src="https://static.wixstatic.com/media/d89c2f_5b117830a17a4c30a77931a70b08052d~mv2.png" alt="Product 5">
                </div> 
                
            </div>
        </div>
    </div>

<script>
    const track = document.getElementById('apparel-track');
    const slides = Array.from(track.children);
    let currentIndex = 0;
    
    const audio = document.getElementById('bg-audio-player');
    const audioButton = document.getElementById('audio-toggle');
    let rotationTimer = null;
    const rotationSpeed = 3000;

    // Bulletproof Slider Render Engine
    function updateSlider() {
        const total = slides.length;
        if (total === 0) return;
        
        slides.forEach((slide, index) => {
            let offset = index - currentIndex;
            if (offset < -Math.floor(total / 2)) offset += total;
            if (offset > Math.floor(total / 2)) offset -= total;
            const absOffset = Math.abs(offset);
            
            if (offset === 0) {
                slide.style.transform = `translateX(0px) scale(1.05) rotateY(0deg) translateZ(60px)`;
                slide.style.zIndex = "10";
                slide.style.opacity = "1";
                slide.style.filter = "none";
            } else {
                const directionX = offset > 0 ? 1 : -1;
                const rotateYValue = offset > 0 ? -30 : 30;
                slide.style.transform = `translateX(${offset * 110}px) scale(0.8) rotateY(${rotateYValue}deg) translateZ(-40px)`;
                slide.style.zIndex = String(5 - Math.ceil(absOffset));
                slide.style.opacity = "0.35"; 
                slide.style.filter = "blur(2px) brightness(0.45)";
            }
        });
    }

    function moveNext() { 
        currentIndex = (currentIndex + 1) % slides.length; 
        updateSlider(); 
    }

    // Bind individual manual slide clicks directly via event listener
    slides.forEach((slide) => {
        slide.addEventListener('click', () => {
            const idx = parseInt(slide.getAttribute('data-index'), 10);
            if (!isNaN(idx)) {
                currentIndex = idx;
                updateSlider();
            }
        });
    });

    // Auto-Scroll Hover Handlers (Triggers over any visible screen element)
    document.addEventListener('mouseenter', startRotation, true);
    document.addEventListener('mouseover', startRotation, true);
    document.addEventListener('mouseleave', stopRotation, true);

    function startRotation() {
        if (!rotationTimer) {
            rotationTimer = setInterval(moveNext, rotationSpeed);
        }
    }

    function stopRotation() {
        if (rotationTimer) {
            clearInterval(rotationTimer);
            rotationTimer = null;
        }
    }

    // Audio Interaction Fix for Custom Embed Frame Structures
    audioButton.addEventListener('click', function() {
        if (audio.paused) {
            audio.play()
                .then(() => { audioButton.textContent = "MUTED"; })
                .catch(err => {
                    console.log("Audio block error:", err);
                    alert("Wix iframe policies are restricting audio playback permissions. Please click directly inside the frame canvas or review your Wix HTML Box permission toggles.");
                });
        } else {
            audio.pause();
            audioButton.textContent = "PLAY BEAT";
        }
    });

    // Initial Layout Fire
    updateSlider();
</script>
</body>
</html>
